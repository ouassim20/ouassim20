<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Ouassim Tijani animated terminal profile</title>
<desc id="desc">A theme-aware terminal banner with ASCII art of Ouassim Tijani and his falcon OT logo.</desc>
<metadata>VISUAL.MAP sources: BBB(1).png and ouassim_tijani_logo_transparent (1).png</metadata>
<style>
  :root{--bg:#070B14;--panel:#0A101F;--frame:#24324A;--text:#F8FAFC;--muted:#94A3B8;--faint:#64748B;--portrait:#A78BFA;--logo:#22D3EE;--chrome:#22D3EE;--chrome2:#155E75;--accent:#10B981}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .label{fill:var(--chrome);font-size:12px;font-weight:700;letter-spacing:.7px}
  .value{fill:var(--text);font-size:13px;font-weight:600}
  .leader{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 5;opacity:.55}
  .ascii{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-weight:700;white-space:pre}
  .portrait-art{fill:var(--portrait);font-size:6.0px;opacity:0;animation:portraitCycle 12s ease-in-out infinite}
  .logo-art{fill:var(--logo);font-size:6.2px;opacity:0;animation:logoCycle 12s ease-in-out infinite}
  .portrait-tag{animation:portraitTag 12s ease-in-out infinite}
  .logo-tag{opacity:0;animation:logoTag 12s ease-in-out infinite}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes portraitCycle{0%,42%,100%{opacity:.98;transform:translateY(0)}48%,94%{opacity:0;transform:translateY(-6px)}}
  @keyframes logoCycle{0%,42%,100%{opacity:0;transform:translateY(6px)}48%,94%{opacity:.98;transform:translateY(0)}}
  @keyframes portraitTag{0%,42%,100%{opacity:1}48%,94%{opacity:0}}
  @keyframes logoTag{0%,42%,100%{opacity:0}48%,94%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.portrait-art{animation:none;opacity:.98}.logo-art,.logo-tag{animation:none;display:none}.portrait-tag,.pulse{animation:none}}
</style>
